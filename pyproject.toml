[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unicore"
version = "0.1.0"
description = "Servidor MCP académico personal"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
    "SQLAlchemy==2.0.51"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]